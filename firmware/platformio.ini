[platformio]
default_envs = watchy-v3

[env]
platform = espressif32@6.9.0
framework = arduino
board_build.partitions = min_spiffs.csv
lib_deps = symlink://..
lib_ldf_mode = deep+
monitor_speed = 115200

; Watchy V3 (ESP32-S3, USB-C). The board defines ARDUINO_ESP32S3_DEV, which selects V3 in config.h.
[env:watchy-v3]
board = esp32-s3-devkitc-1

; Watchy V1/V1.5/V2 (ESP32). config.h defaults to V2 pins when no ARDUINO_WATCHY_* is defined.
[env:watchy-v2]
board = esp32dev
upload_speed = 921600
